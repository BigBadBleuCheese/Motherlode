name: Tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: python:3.7
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - run: python -m unittest -v
